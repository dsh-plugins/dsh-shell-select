<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Shell selection">
  <title>Shell selection</title>
  <!--
    A terminal window whose prompt line is a picker: the shell glyph and a
    downward chevron, so the icon says both "a shell runs here" and "this one is
    chosen". Rounded window body, no gradients, so it stays legible at 16 px in
    the plugin list.
  -->
  <rect x="3" y="10" width="58" height="44" rx="9" fill="#12161f"/>
  <rect x="3" y="10" width="58" height="44" rx="9" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
  <path d="M3 22h58" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="11" cy="16" r="2.1" fill="#f87171"/>
  <circle cx="18" cy="16" r="2.1" fill="#fbbf24"/>
  <circle cx="25" cy="16" r="2.1" fill="#34d399"/>
  <path d="M12 31l7 5-7 5" fill="none" stroke="#e5e7eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M26 41h9" stroke="#e5e7eb" stroke-width="3" stroke-linecap="round"/>
  <path d="M45 33l5 5 5-5" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
