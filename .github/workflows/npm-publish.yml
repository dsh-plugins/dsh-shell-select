name: CI and npm Publish

# Modelled on dsh-auxiliary's workflow: one cross-platform quality matrix, then a
# publish job that derives its version from the ref, then a metadata write-back
# for a stable release.
#
# Two things are this plugin's own. `npm ci` needs a committed lockfile that a
# Linux runner can install — the harness packages are dev dependencies here, so
# the matrix is also what proves the plugin builds against the exact release it
# declares in `engines.dsh`. And the test step sets DSH_SHELL_SELECT_TEST_TMP:
# every GitHub runner checks the repository out inside the runner user's home
# directory, and the suites refuse a fixture root inside a user profile, so the
# scratch directory has to be named explicitly. On Windows the runner's own temp
# volume is right (`D:\a\_temp`), and on Linux `/var/tmp` is used rather than
# `/tmp`, because the POSIX workspace-write profile grants `/tmp` writable and a
# fixture there could not show that a write outside the workspace is denied.
#
# `runner.*` is not available to workflow-level or job-level `env`, which is why
# the variable lives on the step.

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  NPM_REGISTRY: 'https://registry.npmjs.org'

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: ${{ env.NPM_REGISTRY }}
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build package
        run: npm run build
      - name: Regression tests
        env:
          DSH_SHELL_SELECT_TEST_TMP: ${{ runner.os == 'Windows' && format('{0}/dsh-shell-select', runner.temp) || '/var/tmp/dsh-shell-select' }}
        run: node --test tests/*.test.mjs
      - name: Inspect npm package contents
        run: npm pack --dry-run

  publish:
    name: Publish to npm
    needs: "quality"
    if: >-
      github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
      id-token: write
    uses: dsh-plugins/dsh-npm-publish/.github/workflows/npm-publish.yml@main
    with:
      install-command: |
        npm ci
        npm run build
        DSH_SHELL_SELECT_TEST_TMP=/var/tmp/dsh-shell-select node --test tests/*.test.mjs
      prepare-command: "npm pack --dry-run"
